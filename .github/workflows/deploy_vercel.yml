name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Pest Tests"]
    types:
      - completed
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, fileinfo, gd, intl, mbstring, openssl, pdo, pdo_pgsql, tokenizer, zip
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader
          npm ci --no-audit --no-fund

      - name: Build Assets
        run: |
          npm run build
          php artisan package:discover --ansi
          php artisan filament:assets
          php artisan vendor:publish --tag=laravel-assets --force --ansi

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
          vercel-project-name: aureuserp

      - name: Get Deployment URL
        run: |
          echo "Deployment triggered. Check Vercel dashboard for status."
          echo "Project: aureuserp"
